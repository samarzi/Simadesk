<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 420px;
  max-height: 580px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f13;
  color: #e4e4e7;
  font-size: 13px;
}
.header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #27272a;
}
.header-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
}
.header-icon svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; }
.header h1 { font-size: 13px; font-weight: 700; }
.header small { font-size: 10px; color: #71717a; }

.tabs {
  display: flex;
  border-bottom: 1px solid #27272a;
}
.tab-btn {
  flex: 1;
  padding: 8px 4px;
  border: none;
  background: none;
  color: #71717a;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .2s;
}
.tab-btn.active { color: #a78bfa; border-bottom-color: #a78bfa; }
.tab-btn:hover { color: #e4e4e7; }

.task-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.task-panel.active { display: flex; }

.task-header {
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid #27272a;
  min-height: 40px;
  flex-wrap: wrap;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
/* status text shrinks and truncates; progress text stays compact */
[id^="status-text-"] {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
[id^="progress-text-"] {
  flex-shrink: 0;
  white-space: nowrap;
}
.status-dot.idle { background: #52525b; }
.status-dot.running { background: #3b82f6; animation: pulse 2s infinite; }
.status-dot.paused { background: #06b6d4; animation: pulse 2s infinite; }
.status-dot.completed { background: #22c55e; }
.status-dot.error { background: #ef4444; }
.status-dot.stopped { background: #f59e0b; }

.progress-bar {
  height: 3px;
  background: #27272a;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  transition: width .3s;
}

.terminal {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  background: #0a0a0f;
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: 10px;
  line-height: 1.6;
  max-height: 380px;
  min-height: 200px;
}
.terminal .line { white-space: pre-wrap; word-break: break-word; }
.terminal .line.info { color: #60a5fa; }
.terminal .line.success { color: #4ade80; }
.terminal .line.warn { color: #fbbf24; }
.terminal .line.err { color: #f87171; }
.terminal .line.default { color: #8b949e; }

.empty-state {
  padding: 32px 16px;
  text-align: center;
  color: #52525b;
  font-size: 11px;
}
.stop-btn, .skip-btn, .pause-btn, .copy-btn {
  flex-shrink: 0;
  padding: 3px 8px;
  border-radius: 5px;
  background: transparent;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  border: 1px solid currentColor;
  white-space: nowrap;
}
.stop-btn  { display: none; color: #ef4444; }
.skip-btn  { display: none; color: #f59e0b; }
.pause-btn { display: none; color: #06b6d4; }
.copy-btn  { color: #6366f1; }

.stop-btn:hover  { background: #ef4444; color: #fff; }
.skip-btn:hover  { background: #f59e0b; color: #000; }
.pause-btn:hover { background: #06b6d4; color: #000; }
.copy-btn:hover  { background: #6366f1; color: #fff; }

.stop-btn.visible  { display: inline-block; }
.skip-btn.visible  { display: inline-block; }
.pause-btn.visible { display: inline-block; }

.pause-btn.paused       { color: #3b82f6; }
.pause-btn.paused:hover { background: #3b82f6; color: #fff; }

.copy-btn.copied       { color: #22c55e; }
.copy-btn.copied:hover { background: #22c55e; color: #fff; }

.footer {
  padding: 8px 16px;
  border-top: 1px solid #27272a;
  text-align: center;
}
.footer a {
  color: #8b5cf6;
  text-decoration: none;
  font-size: 11px;
  font-weight: 600;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}
</style>
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <h1>SimaDesk Automation</h1>
      <small>v1.1.3</small>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="yandex-warehouses">Яндекс Склады</button>
    <button class="tab-btn" data-tab="yandex-tariffs">Яндекс Тарифы</button>
    <button class="tab-btn" data-tab="ozon-warehouses">Озон Склады</button>
  </div>

  <div class="task-panel active" data-panel="yandex-warehouses">
    <div class="task-header">
      <span class="status-dot idle" id="status-yandex-warehouses"></span>
      <span id="status-text-yandex-warehouses" style="font-size:11px;color:#71717a">Ожидание запуска</span>
      <span id="progress-text-yandex-warehouses" style="font-size:10px;color:#71717a"></span>
      <button class="pause-btn" id="pause-yandex-warehouses" data-type="yandex-warehouses">⏸ Пауза</button>
      <button class="stop-btn" id="stop-yandex-warehouses" data-type="yandex-warehouses">Стоп</button>
      <button class="copy-btn" data-type="yandex-warehouses">Копировать</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-yandex-warehouses" style="width:0%"></div></div>
    <div class="terminal" id="terminal-yandex-warehouses">
      <div class="empty-state">Запустите автоматизацию<br>на сайте SimaDesk</div>
    </div>
  </div>

  <div class="task-panel" data-panel="yandex-tariffs">
    <div class="task-header">
      <span class="status-dot idle" id="status-yandex-tariffs"></span>
      <span id="status-text-yandex-tariffs" style="font-size:11px;color:#71717a">Ожидание запуска</span>
      <span id="progress-text-yandex-tariffs" style="font-size:10px;color:#71717a"></span>
      <button class="pause-btn" id="pause-yandex-tariffs" data-type="yandex-tariffs">⏸ Пауза</button>
      <button class="stop-btn" id="stop-yandex-tariffs" data-type="yandex-tariffs">Стоп</button>
      <button class="copy-btn" data-type="yandex-tariffs">Копировать</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-yandex-tariffs" style="width:0%"></div></div>
    <div class="terminal" id="terminal-yandex-tariffs">
      <div class="empty-state">Запустите автоматизацию<br>на сайте SimaDesk</div>
    </div>
  </div>

  <div class="task-panel" data-panel="ozon-warehouses">
    <div class="task-header">
      <span class="status-dot idle" id="status-ozon-warehouses"></span>
      <span id="status-text-ozon-warehouses" style="font-size:11px;color:#71717a">Ожидание запуска</span>
      <span id="progress-text-ozon-warehouses" style="font-size:10px;color:#71717a"></span>
      <button class="skip-btn" id="skip-ozon-warehouses" data-type="ozon-warehouses">Пропустить</button>
      <button class="pause-btn" id="pause-ozon-warehouses" data-type="ozon-warehouses">⏸ Пауза</button>
      <button class="stop-btn" id="stop-ozon-warehouses" data-type="ozon-warehouses">Стоп</button>
      <button class="copy-btn" data-type="ozon-warehouses">Копировать</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-ozon-warehouses" style="width:0%"></div></div>
    <div class="terminal" id="terminal-ozon-warehouses">
      <div class="empty-state">Запустите автоматизацию<br>на сайте SimaDesk</div>
    </div>
  </div>

  <div class="footer">
    <a href="https://sabatov.netlify.app" target="_blank">Открыть SimaDesk</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
