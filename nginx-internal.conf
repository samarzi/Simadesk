events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /storefront.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Статические страницы — точные совпадения, приоритет выше regex slug
        location = /offer {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /offer.html =404;
        }
        location = /privacy {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /privacy.html =404;
        }
        location = /pricing {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /pricing.html =404;
        }
        location = /info {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /info.html =404;
        }

        # Public SimaStore slug routes → standalone storefront page
        location ~ "^/[a-z0-9][a-z0-9-]{0,48}[a-z0-9]" {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri /storefront.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /index.html;
    }
}
