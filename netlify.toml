[build]
  publish = "dist"
  command = "npx tsc --noEmit && npm test && npm run build"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Marketplace API proxies ────────────────────────────────────────────────────
# ВАЖНО: эти правила должны быть ДО catch-all "/*" — Netlify берёт первое совпадение.
#
# Как это работает (status = 200 + внешний URL = transparent proxy):
#   1. Браузер запрашивает  GET sabatov.netlify.app/ozon-api/v3/product/list
#   2. Netlify Edge перехватывает и САМА обращается к api-seller.ozon.ru/v3/product/list
#   3. Все заголовки (Client-Id, Api-Key, Authorization) пробрасываются через Edge
#   4. Браузер получает ответ как будто от sabatov.netlify.app → CORS не нужен
#   5. Код обрабатывает JSON как обычно

[[redirects]]
  from = "/ozon-api/*"
  to   = "https://api-seller.ozon.ru/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/yandex-api/*"
  to   = "https://api.partner.market.yandex.ru/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/wb-content/*"
  to   = "https://content-api.wildberries.ru/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/wb-marketplace/*"
  to   = "https://marketplace-api.wildberries.ru/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/wb-stats/*"
  to   = "https://statistics-api.wildberries.ru/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/wb-common/*"
  to   = "https://common-api.wildberries.ru/:splat"
  status = 200
  force  = true

# ── WB Prices API (цены и скидки) ─────────────────────────────────────────────
[[redirects]]
  from = "/wb-prices/*"
  to   = "https://discounts-prices-api.wildberries.ru/:splat"
  status = 200
  force  = true

# ── WB Feedbacks API (отзывы) — отдельный хост ────────────────────────────────
[[redirects]]
  from = "/wb-feedback/*"
  to   = "https://feedbacks-api.wildberries.ru/:splat"
  status = 200
  force  = true

# ── WB Card API (публичные карточки товаров, реальная цена покупателя с СПП) ──
[[redirects]]
  from = "/wb-card/*"
  to   = "https://card.wb.ru/:splat"
  status = 200
  force  = true

# ── SPA catch-all (должен быть ПОСЛЕДНИМ) ─────────────────────────────────────
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

