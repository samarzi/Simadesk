events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss image/svg+xml;

    # ── Upstream services ───────────────────────────────────────────────────
    upstream frontend  { server frontend:80; }
    upstream rest      { server rest:3000; }
    upstream auth      { server auth:9999; }
    upstream functions { server functions:9000; }
    upstream storage   { server storage:5000; }
    upstream realtime  { server realtime:4000; }

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name samarzi.online www.samarzi.online;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name samarzi.online www.samarzi.online;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Supabase REST API ───────────────────────────────────────────────
        location /rest/v1/ {
            proxy_pass http://rest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Supabase Auth ───────────────────────────────────────────────────
        location /auth/v1/ {
            proxy_pass http://auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Supabase Edge Functions ─────────────────────────────────────────
        location /functions/v1/ {
            proxy_pass http://functions/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Supabase Storage ────────────────────────────────────────────────
        location /storage/v1/ {
            proxy_pass http://storage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }

        # ── Supabase Realtime ───────────────────────────────────────────────
        location /realtime/v1/ {
            proxy_pass http://realtime/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Marketplace API proxies (заменяет Netlify redirects) ────────────

        location /ozon-api/ {
            proxy_pass https://api-seller.ozon.ru/;
            proxy_ssl_server_name on;
            proxy_set_header Host api-seller.ozon.ru;
            proxy_pass_request_headers on;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /yandex-api/ {
            proxy_pass https://api.partner.market.yandex.ru/;
            proxy_ssl_server_name on;
            proxy_set_header Host api.partner.market.yandex.ru;
            proxy_pass_request_headers on;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /wb-content/ {
            proxy_pass https://content-api.wildberries.ru/;
            proxy_ssl_server_name on;
            proxy_set_header Host content-api.wildberries.ru;
            proxy_pass_request_headers on;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /wb-marketplace/ {
            proxy_pass https://marketplace-api.wildberries.ru/;
            proxy_ssl_server_name on;
            proxy_set_header Host marketplace-api.wildberries.ru;
            proxy_pass_request_headers on;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /wb-stats/ {
            proxy_pass https://statistics-api.wildberries.ru/;
            proxy_ssl_server_name on;
            proxy_set_header Host statistics-api.wildberries.ru;
            proxy_pass_request_headers on;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /wb-common/ {
            proxy_pass https://common-api.wildberries.ru/;
            proxy_ssl_server_name on;
            proxy_set_header Host common-api.wildberries.ru;
            proxy_pass_request_headers on;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /wb-prices/ {
            proxy_pass https://discounts-prices-api.wildberries.ru/;
            proxy_ssl_server_name on;
            proxy_set_header Host discounts-prices-api.wildberries.ru;
            proxy_pass_request_headers on;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /wb-feedback/ {
            proxy_pass https://feedbacks-api.wildberries.ru/;
            proxy_ssl_server_name on;
            proxy_set_header Host feedbacks-api.wildberries.ru;
            proxy_pass_request_headers on;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /wb-card/ {
            proxy_pass https://card.wb.ru/;
            proxy_ssl_server_name on;
            proxy_set_header Host card.wb.ru;
            proxy_pass_request_headers on;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ── SPA Frontend (catch-all) ────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
