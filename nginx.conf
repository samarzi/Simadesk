events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    gzip on; gzip_vary on; gzip_min_length 1024; gzip_proxied any; gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # Only Docker's internal DNS — 8.8.8.8 must NOT be listed (it can't resolve Docker service names)
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 3s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ── Порт 80: API без редиректа (для внутренних Docker-запросов)
    server {
        listen 80;
        server_name _;

        # Блокируем .env файлы (сканеры)
        location ~* /\.env { return 403; }

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location /rest/v1/ {
            set $u rest:3000;
            rewrite ^/rest/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /auth/v1/ {
            set $u auth:9999;
            rewrite ^/auth/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /functions/v1/ {
            set $u functions:9000;
            rewrite ^/functions/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /storage/v1/ {
            set $u storage:5000;
            rewrite ^/storage/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }
        location /realtime/v1/ {
            set $u realtime:4000;
            rewrite ^/realtime/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        location / { return 301 https://$host$request_uri; }
    }

    # ── Порт 443: HTTPS для внешних пользователей
    server {
        listen 443 ssl;
        server_name simadesk.ru www.simadesk.ru;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Блокируем .env файлы (сканеры)
        location ~* /\.env { return 403; }

        location /rest/v1/ {
            set $u rest:3000;
            rewrite ^/rest/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /auth/v1/ {
            set $u auth:9999;
            rewrite ^/auth/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /functions/v1/ {
            set $u functions:9000;
            rewrite ^/functions/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /storage/v1/ {
            set $u storage:5000;
            rewrite ^/storage/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }
        location /realtime/v1/ {
            set $u realtime:4000;
            rewrite ^/realtime/v1/(.*) /$1 break;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ozon-api/ {
            set $ozon api-seller.ozon.ru;
            rewrite ^/ozon-api/(.*) /$1 break;
            proxy_pass https://$ozon;
            proxy_ssl_server_name on;
            proxy_set_header Host $ozon;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
        location /yandex-api/ {
            set $yandex api.partner.market.yandex.ru;
            rewrite ^/yandex-api/(.*) /$1 break;
            proxy_pass https://$yandex;
            proxy_ssl_server_name on;
            proxy_set_header Host $yandex;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
        location /wb-content/ {
            set $wb content-api.wildberries.ru;
            rewrite ^/wb-content/(.*) /$1 break;
            proxy_pass https://$wb;
            proxy_ssl_server_name on;
            proxy_set_header Host $wb;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
        location /wb-marketplace/ {
            set $wb marketplace-api.wildberries.ru;
            rewrite ^/wb-marketplace/(.*) /$1 break;
            proxy_pass https://$wb;
            proxy_ssl_server_name on;
            proxy_set_header Host $wb;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
        location /wb-stats/ {
            set $wb statistics-api.wildberries.ru;
            rewrite ^/wb-stats/(.*) /$1 break;
            proxy_pass https://$wb;
            proxy_ssl_server_name on;
            proxy_set_header Host $wb;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
        location /wb-common/ {
            set $wb common-api.wildberries.ru;
            rewrite ^/wb-common/(.*) /$1 break;
            proxy_pass https://$wb;
            proxy_ssl_server_name on;
            proxy_set_header Host $wb;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
        location /wb-prices/ {
            set $wb discounts-prices-api.wildberries.ru;
            rewrite ^/wb-prices/(.*) /$1 break;
            proxy_pass https://$wb;
            proxy_ssl_server_name on;
            proxy_set_header Host $wb;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
        location /wb-feedback/ {
            set $wb feedbacks-api.wildberries.ru;
            rewrite ^/wb-feedback/(.*) /$1 break;
            proxy_pass https://$wb;
            proxy_ssl_server_name on;
            proxy_set_header Host $wb;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
        location /wb-card/ {
            set $wb card.wb.ru;
            rewrite ^/wb-card/(.*) /$1 break;
            proxy_pass https://$wb;
            proxy_ssl_server_name on;
            proxy_set_header Host $wb;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
        location /wb-buyer-chat/ {
            set $wb buyer-chat-api.wildberries.ru;
            rewrite ^/wb-buyer-chat/(.*) /$1 break;
            proxy_pass https://$wb;
            proxy_ssl_server_name on;
            proxy_set_header Host $wb;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location / {
            set $fe frontend:80;
            proxy_pass http://$fe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
